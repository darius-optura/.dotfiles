# Optura tmux theme (light) — off-white canvas, dark-gold accents, floating pills.
# Brand: https://optura.ai (gold-on-light forbidden; dark-gold for "gold" role)
# Requires a Nerd-Font-patched terminal font.

# ─── Status core ────────────────────────────────────────────────
set -g status on
set -g status 2
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-left-length  200
set -g status-right-length 200

# Slight elevation over the off-white canvas
set -g status-style "bg=default fg=#3a3732"

# Transparent strip — sections the bar off from pane content
set -g status-format[1] "#[bg=default,fg=default] "

# ─── Left: session pill ─────────────────────────────────────────
set -g status-left "\
#[fg=#8b6914,bg=default]#[fg=#f0eee4,bg=#8b6914,bold]   #S #[fg=#8b6914,bg=default] "

# ─── Windows ───────────────────────────────────────────────────
set -g window-status-format         "#[fg=#d6d0c2,bg=default]#[fg=#56524a,bg=#d6d0c2] #I #[fg=#a9a396]· #[fg=#3a3732]#W #[fg=#d6d0c2,bg=default] "
set -g window-status-current-format "#[fg=#f0eee4,bg=default]#[fg=#8b6914,bg=#f0eee4,bold]   #I #[fg=#a9a396]· #[fg=#1a1616]#W #[fg=#f0eee4,bg=default] "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#8b6914,bg=#d6d0c2,bold"
set -g window-status-bell-style     "fg=#a33b3b,bg=#d6d0c2,bold"

# ─── Right: prefix · host · date · time ─────────────────────────
set -g status-right "\
#{?client_prefix,#[fg=#420d41#,bg=default]#[fg=#f0eee4#,bg=#420d41#,bold]   PREFIX #[fg=#420d41#,bg=default] ,}\
#[fg=#d6d0c2,bg=default]#[fg=#3a3732,bg=#d6d0c2]   #h #[fg=#d6d0c2,bg=default] \
#[fg=#f0eee4,bg=default]#[fg=#1a1616,bg=#f0eee4]   %a %b %d #[fg=#f0eee4,bg=default] \
#[fg=#8b6914,bg=default]#[fg=#f0eee4,bg=#8b6914,bold]  %H:%M #[fg=#8b6914,bg=default] "

# ─── Panes ──────────────────────────────────────────────────────
set -g pane-border-style        "fg=#d6d0c2"
set -g pane-active-border-style "fg=#8b6914"
set -g pane-border-lines single

# ─── Messages / copy mode ───────────────────────────────────────
set -g message-style         "bg=#d9ecf7 fg=#1a1616,bold"
set -g message-command-style "bg=#d9ecf7 fg=#8b6914,bold"
set -g mode-style            "bg=#d9ecf7 fg=#1a1616"

# ─── Clock ──────────────────────────────────────────────────────
set -g clock-mode-colour "#2a7d6a"
set -g clock-mode-style 24
