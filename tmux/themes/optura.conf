# Optura tmux theme (dark) — gold-led floating-pill statusline.
# Brand: https://optura.ai
# Requires a Nerd-Font-patched terminal font (Berkeley Mono Nerd Font etc.)
# Uses rounded powerline glyphs:  (U+E0B6 left cap)  (U+E0B4 right cap)

# ─── Status core ────────────────────────────────────────────────
set -g status on
set -g status 2
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-left-length  200
set -g status-right-length 200

# Slight elevation over the charcoal canvas — "floating bar" feel
set -g status-style "bg=default fg=#d6d0c2"

# Line 1: transparent strip — uses terminal default bg, so ghostty's bg/blur
# shows through. Sections the bar off from pane content.
set -g status-format[1] "#[bg=default,fg=default] "

# ─── Pill helpers (kept inline for portability) ─────────────────
# Pattern for a pill on the elevated bar bg #211d1c:
#   #[fg=PILLBG,bg=default]#[fg=FG,bg=PILLBG,bold] content #[fg=PILLBG,bg=default]

# ─── Left: session pill ─────────────────────────────────────────
set -g status-left "\
#[fg=#d0ae50,bg=default]#[fg=#1a1616,bg=#d0ae50,bold]   #S #[fg=#d0ae50,bg=default] "

# ─── Windows ───────────────────────────────────────────────────
# Each window is a rounded pill. Inactive on neutral-800, active on neutral-700 with gold accent.
set -g window-status-format         "#[fg=#2a2524,bg=default]#[fg=#a9a396,bg=#2a2524] #I #[fg=#56524a]· #[fg=#a9a396]#W #[fg=#2a2524,bg=default] "
set -g window-status-current-format "#[fg=#3a3732,bg=default]#[fg=#d0ae50,bg=#3a3732,bold]   #I #[fg=#7a756a]· #[fg=#f0eee4]#W #[fg=#3a3732,bg=default] "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#d0ae50,bg=#2a2524,bold"
set -g window-status-bell-style     "fg=#c8595a,bg=#2a2524,bold"

# ─── Right: prefix · host · date · time ─────────────────────────
set -g status-right "\
#{?client_prefix,#[fg=#420d41#,bg=default]#[fg=#f0eee4#,bg=#420d41#,bold]   PREFIX #[fg=#420d41#,bg=default] ,}\
#[fg=#2a2524,bg=default]#[fg=#d6d0c2,bg=#2a2524]   #h #[fg=#2a2524,bg=default] \
#[fg=#3a3732,bg=default]#[fg=#f0eee4,bg=#3a3732]   %a %b %d #[fg=#3a3732,bg=default] \
#[fg=#d0ae50,bg=default]#[fg=#1a1616,bg=#d0ae50,bold]  %H:%M #[fg=#d0ae50,bg=default] "

# ─── Panes ──────────────────────────────────────────────────────
set -g pane-border-style        "fg=#332d2b"
set -g pane-active-border-style "fg=#d0ae50"
set -g pane-border-lines single

# ─── Messages / copy mode ───────────────────────────────────────
set -g message-style         "bg=#420d41 fg=#f0eee4,bold"
set -g message-command-style "bg=#420d41 fg=#d0ae50,bold"
set -g mode-style            "bg=#420d41 fg=#f0eee4"

# ─── Clock ──────────────────────────────────────────────────────
set -g clock-mode-colour "#61c2ab"
set -g clock-mode-style 24
