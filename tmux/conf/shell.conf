# Shell Configuration

# Set PATH environment (supports Intel Mac, Apple Silicon Mac, and Linux)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

# Detect fish shell location: Apple Silicon Homebrew, Intel Homebrew, Linux.
# if-shell runs the test; %if only evaluates a format string, so a quoted
# "test -x ..." was always true and picked the Apple Silicon path everywhere.
if-shell "test -x /opt/homebrew/bin/fish" \
  "set -g default-shell /opt/homebrew/bin/fish ; set -g default-command /opt/homebrew/bin/fish"
if-shell "test ! -x /opt/homebrew/bin/fish && test -x /usr/local/bin/fish" \
  "set -g default-shell /usr/local/bin/fish ; set -g default-command /usr/local/bin/fish"
if-shell "test ! -x /opt/homebrew/bin/fish && test ! -x /usr/local/bin/fish && test -x /usr/bin/fish" \
  "set -g default-shell /usr/bin/fish ; set -g default-command /usr/bin/fish"
