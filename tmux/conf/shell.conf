# Shell Configuration

# Set PATH environment (supports Intel Mac, Apple Silicon Mac, and Linux)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

# Detect fish shell location
%if "test -x /opt/homebrew/bin/fish"
set -g default-shell "/opt/homebrew/bin/fish"
set -g default-command "/opt/homebrew/bin/fish"
%elif "test -x /usr/local/bin/fish"
set -g default-shell "/usr/local/bin/fish"
set -g default-command "/usr/local/bin/fish"
%elif "test -x /usr/bin/fish"
set -g default-shell "/usr/bin/fish"
set -g default-command "/usr/bin/fish"
%endif
